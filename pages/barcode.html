<div class="page-head">
  <h1>Viora tools - Barcode</h1>
  <p>باركود شريطي ورمز QR — بالكامل داخل متصفحك، مع إمكانية وضع شعار داخل رمز QR.</p>
</div>

<div class="vec">

  <!-- ============ لوحة التحكم ============ -->
  <div class="panel">

    <div class="field">
      <label>نوع الرمز</label>
      <div class="seg" id="kind" style="width:100%">
        <button type="button" data-k="qr" class="on" style="flex:1">رمز QR</button>
        <button type="button" data-k="bar" style="flex:1">باركود شريطي</button>
      </div>
    </div>

    <!-- ===== إعدادات QR ===== -->
    <div id="qr-panel">
      <div class="field">
        <label for="qr-text">النص أو الرابط</label>
        <textarea id="qr-text" rows="3" spellcheck="false">https://example.com</textarea>
      </div>

      <div class="field">
        <label for="qr-ecl">مستوى تصحيح الأخطاء</label>
        <select id="qr-ecl">
          <option value="L">L — 7%</option>
          <option value="M" selected>M — 15%</option>
          <option value="Q">Q — 25%</option>
          <option value="H">H — 30% (مطلوب مع الشعار)</option>
        </select>
      </div>

      <div class="field">
        <label for="qr-scale">حجم الوحدة <b id="v-qr-scale">8</b></label>
        <input type="range" id="qr-scale" min="2" max="24" step="1" value="8">
      </div>

      <div class="field">
        <label for="qr-margin">الهامش (وحدات) <b id="v-qr-margin">4</b></label>
        <input type="range" id="qr-margin" min="0" max="10" step="1" value="4">
      </div>

      <div class="field">
        <label>الألوان</label>
        <div style="display:flex;gap:10px">
          <label class="clr"><input type="color" id="qr-fg" value="#000000"> المقدمة</label>
          <label class="clr"><input type="color" id="qr-bg" value="#ffffff"> الخلفية</label>
        </div>
        <label class="check" style="margin:10px 0 0"><input type="checkbox" id="qr-transparent"> خلفية شفافة</label>
      </div>

      <hr class="sep">

      <div class="field">
        <label>شعار داخل الرمز</label>
        <div class="drop mini" id="logo-drop">
          <b>اسحب صورة الشعار</b>
          <span>أو انقر للاختيار</span>
          <input type="file" id="logo-file" accept="image/*" hidden>
        </div>
        <div class="notice" id="logo-info" hidden style="margin-top:10px">
          <img id="logo-thumb" alt="" style="width:28px;height:28px;object-fit:contain;border-radius:6px">
          <span id="logo-name" style="flex:1"></span>
          <button type="button" id="logo-clear">إزالة</button>
        </div>
      </div>

      <div class="field" id="f-logo-size" hidden>
        <label for="logo-size">حجم الشعار <b id="v-logo-size">22</b>%</label>
        <input type="range" id="logo-size" min="10" max="34" step="1" value="22">
        <div class="hint">كلّما كبر الشعار زاد خطر تعذّر القراءة — أبقِ التصحيح على H.</div>
      </div>

      <div class="field" id="f-logo-pad" hidden>
        <label for="logo-pad">حشوة حول الشعار <b id="v-logo-pad">4</b></label>
        <input type="range" id="logo-pad" min="0" max="14" step="1" value="4">
        <label class="check" style="margin:10px 0 0"><input type="checkbox" id="logo-round" checked> حشوة دائرية</label>
      </div>
    </div>

    <!-- ===== إعدادات الباركود الشريطي ===== -->
    <div id="bar-panel" hidden>
      <div class="field">
        <label for="bar-type">المعيار</label>
        <select id="bar-type">
          <option value="ean13" selected>EAN-13</option>
          <option value="ean8">EAN-8</option>
          <option value="upca">UPC-A</option>
          <option value="code128">Code128 (نص حر)</option>
        </select>
      </div>

      <div class="field">
        <label for="bar-text">القيمة</label>
        <input type="text" id="bar-text" value="000000000000" spellcheck="false">
        <div class="hint" id="bar-hint">١٢ رقماً، ورقم التحقّق يُحسب تلقائياً.</div>
      </div>

      <div class="field">
        <label for="bar-mw">عرض الشريط <b id="v-bar-mw">3</b></label>
        <input type="range" id="bar-mw" min="1" max="8" step="1" value="3">
      </div>

      <div class="field">
        <label for="bar-h">ارتفاع الأشرطة <b id="v-bar-h">160</b></label>
        <input type="range" id="bar-h" min="40" max="320" step="10" value="160">
      </div>

      <div class="field">
        <label>الألوان</label>
        <div style="display:flex;gap:10px">
          <label class="clr"><input type="color" id="bar-fg" value="#000000"> المقدمة</label>
          <label class="clr"><input type="color" id="bar-bg" value="#ffffff"> الخلفية</label>
        </div>
        <label class="check" style="margin:10px 0 0"><input type="checkbox" id="bar-showtext" checked> إظهار القيمة أسفل الأشرطة</label>
      </div>
    </div>

    <div class="status" id="bc-status">جاهز.</div>
  </div>

  <!-- ============ المعاينة ============ -->
  <div>
    <div class="stage-bar">
      <button class="btn ghost" id="bc-png" style="width:auto;padding:6px 14px;font-size:13px">تنزيل PNG</button>
      <button class="btn ghost" id="bc-svg" style="width:auto;padding:6px 14px;font-size:13px">تنزيل SVG</button>
      <button class="btn ghost" id="bc-copy" style="width:auto;padding:6px 14px;font-size:13px">نسخ الصورة</button>
      <div class="spacer"></div>
    </div>

    <div class="stage" id="bc-stage">
      <canvas id="bc-canvas"></canvas>
    </div>

    <div id="bc-notices"></div>
    <div class="stats" id="bc-stats"></div>
  </div>

</div>

<script src="js/barcode-page.js"></script>
